<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phim Xuyên Đêm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #6d28d9);
            color: #f9fafb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 38px 30px;
            border-radius: 22px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #eef2ff;
            margin-bottom: 20px;
        }

        .url {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 22px;
            word-break: break-all;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            color: #0f172a;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.45);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(99, 102, 241, 0.6);
        }

        .countdown {
            margin-top: 16px;
            font-size: 14px;
            color: #c7d2fe;
        }

        @media (min-width: 1024px) {
            h1 {
                font-size: 30px;
            }

            p {
                font-size: 18px;
            }

            .btn {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <img
        src="https://phimxuyendem.vercel.app/icon-192x192.png"
        alt="Phim Xuyên Đêm"
        class="logo"
    >

    <h1>Địa chỉ này không còn sử dụng</h1>

    <p>
        Phim Xuyên Đêm đã chuyển sang địa chỉ mới để hoạt động ổn định hơn.  
        Bạn vui lòng truy cập link bên dưới để tiếp tục xem phim nhé.
    </p>

    <div class="url">
        https://phimxuyendem.vercel.app
    </div>

    <a class="btn" href="https://phimxuyendem.vercel.app">
        Truy cập Phim Xuyên Đêm
    </a>

    <div class="countdown">
        Tự động chuyển sau <span id="time">10</span> giây…
    </div>
</div>

<script>
    let seconds = 10;
    const timeEl = document.getElementById("time");

    const interval = setInterval(() => {
        seconds--;
        timeEl.textContent = seconds;

        if (seconds <= 0) {
            clearInterval(interval);
            window.location.href = "https://phimxuyendem.vercel.app";
        }
    }, 1000);
</script>

</body>
</html>
